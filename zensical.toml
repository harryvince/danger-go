[project]
site_name = "danger-go"
site_url = "https://harryvince.github.io/danger-go/"
site_description = "A Go-native pull request policy runner inspired by Danger."
site_author = "Harry Vince"
copyright = "Copyright &copy; 2026 Harry Vince"
docs_dir = "docs"
site_dir = "site"

[project.theme]
name = "zensical"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.theme.repository]
name = "harryvince/danger-go"
url = "https://github.com/harryvince/danger-go"
