[tools]
python = "3.14"
uv = "latest"

[tasks."docs:build"]
description = "Build the Zensical documentation site"
run = "uv run zensical build --clean"

[tasks."docs:serve"]
description = "Preview the Zensical documentation site locally"
run = "uv run zensical serve"

[tasks."release:build"]
description = "Build local release archives into dist/"
run = "scripts/build-release-artifacts.sh"
